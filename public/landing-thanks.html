<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>We'll text you | USSCALLISTER</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400&display=swap" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
    video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000; z-index: 0;
    }
    .shade {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      z-index: 1; pointer-events: none;
    }
    main {
      position: relative; z-index: 2; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 20px; box-sizing: border-box;
    }
    .col { width: min(640px, 100%); text-align: center; }
    h1 {
      margin: 0; font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500; font-size: 40px; line-height: 1.05; color: #fff;
    }
    .sub {
      margin: 16px 0 0; font-family: Inter, sans-serif;
      font-size: 18px; line-height: 1.45; color: #b8b8b8;
    }
    .confirm {
      margin: 32px 0 0; font-family: Inter, sans-serif;
      font-size: 16px; line-height: 1.45; color: #fff;
    }
    @media (min-width: 640px) { h1 { font-size: 64px; } }
  </style>
</head>
<body>
  <video src="/media/floor-m.mp4?v=3" poster="/media/floor-poster.jpg?v=hd" autoplay muted loop playsinline></video>
  <div class="shade"></div>
  <main>
    <div class="col">
      <h1>Your website's new. It's still not working.</h1>
      <p class="sub">Most sites look finished and still lose the call.</p>
      <p class="confirm">We'll text you within one business day.</p>
    </div>
  </main>
</body>
</html>
